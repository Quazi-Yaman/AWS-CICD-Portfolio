version: 0.2

phases:

  install:
    runtime-versions:
      python: 3.13
    commands:
      - echo "Installing dependencies..."
      - pip install pytest

  pre_build:
    commands:
      - echo "Running automated tests..."
      - pytest tests/

  build:
    commands:
      - echo "Preparing website for deployment..."
      - mkdir -p build
      - cp -r frontend/* build/

  post_build:
    commands:
      - echo "Build completed successfully."

artifacts:
  files:
    - '**/*'
  base-directory: build
